<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8442f">
  <title>Lista zakupów</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="cloth" aria-hidden="true"></div>

  <!-- logowanie -->
  <main id="auth" class="login" hidden>
    <header class="login-head">
      <p class="eyebrow">Kuchnia</p>
      <h1>Kto dopisuje?</h1>
    </header>
    <form id="login-form" class="login-form">
      <label for="login-user">Login</label>
      <input id="login-user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="np. kuba.grochowscy" required>
      <label for="login-pass">Hasło</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn" id="login-btn">Wejdź</button>
      <p class="error" id="login-error" role="alert"></p>
      <p class="form-intro">Login i hasło dostajesz od administratora.</p>
    </form>
  </main>

  <!-- lista -->
  <main id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow" id="family-label">Lista zakupów</p>
        <h1 id="title">Do kupienia</h1>
      </div>
      <button class="me" id="me" type="button" title="Wyloguj">
        <span class="me-dot" id="me-dot"></span>
        <span id="me-name"></span>
      </button>
    </header>

    <section class="pad" aria-live="polite">
      <div id="list"></div>
      <p class="empty" id="empty" hidden>Lodówka pełna — nic tu nie ma.<br><span>Dopisz pierwszą rzecz na dole.</span></p>

      <details class="basket" id="basket" hidden>
        <summary>
          <span>W koszyku <b id="basket-count">0</b></span>
          <button type="button" class="link" id="clear-done">Wyczyść kupione</button>
        </summary>
        <ul id="done-list" class="rows"></ul>
      </details>
    </section>

    <form class="add" id="add-form" autocomplete="off">
      <div class="add-row">
        <input id="add-name" name="name" placeholder="Dopisz do listy…" maxlength="120" required aria-label="Co kupić">
        <input id="add-qty" name="qty" placeholder="ile?" maxlength="30" aria-label="Ilość">
        <button class="btn add-btn" type="submit" aria-label="Dodaj">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </form>
  </main>

  <dialog class="confirm" id="confirm">
    <form method="dialog">
      <p class="confirm-q"><span id="confirm-text"></span><br><strong id="confirm-name"></strong></p>
      <div class="confirm-actions">
        <button class="btn-ghost" value="cancel">Nie</button>
        <button class="btn" value="yes" id="confirm-yes">Tak</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="categories.js"></script>
  <script src="app.js"></script>
</body>
</html>
